name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/figueroamatias/ingsoft3-backend
  FRONTEND_IMAGE: ghcr.io/figueroamatias/ingsoft3-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests and coverage gate
        working-directory: ./backend
        run: npm run test:coverage

      - name: Add backend coverage to job summary
        if: ${{ always() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        run: node scripts/write-coverage-summary.mjs backend/coverage/coverage-summary.json Backend

      - name: Upload backend coverage report
        if: ${{ always() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ github.run_id }}
          path: backend/coverage
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests and coverage gate
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Add frontend coverage to job summary
        if: ${{ always() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: node scripts/write-coverage-summary.mjs frontend/coverage/coverage-summary.json Frontend

      - name: Upload frontend coverage report
        if: ${{ always() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: frontend/coverage
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish-backend:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image identified by commit SHA
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  publish-frontend:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend image identified by commit SHA
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CD_ENABLED == 'true' }}
    needs:
      - publish-backend
      - publish-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: qa
      url: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6

      - name: Set up Node.js for deployment scripts
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy verified images to QA
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
        run: |
          scripts/trigger-render-deploy.sh "$BACKEND_DEPLOY_HOOK" "${BACKEND_IMAGE}:${GITHUB_SHA}"
          scripts/trigger-render-deploy.sh "$FRONTEND_DEPLOY_HOOK" "${FRONTEND_IMAGE}:${GITHUB_SHA}"

      - name: Smoke test QA
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: scripts/smoke-test.sh "$BACKEND_URL" "$FRONTEND_URL" "$GITHUB_SHA"

  deploy-prod:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CD_ENABLED == 'true' }}
    needs:
      - deploy-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6

      - name: Set up Node.js for deployment scripts
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy approved images to production
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
        run: |
          scripts/trigger-render-deploy.sh "$BACKEND_DEPLOY_HOOK" "${BACKEND_IMAGE}:${GITHUB_SHA}"
          scripts/trigger-render-deploy.sh "$FRONTEND_DEPLOY_HOOK" "${FRONTEND_IMAGE}:${GITHUB_SHA}"

      - name: Smoke test production
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: scripts/smoke-test.sh "$BACKEND_URL" "$FRONTEND_URL" "$GITHUB_SHA"
